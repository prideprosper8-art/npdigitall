<!DOCTYPE html>
<html>
<head>
  <title>Contact Form - NP Digital</title>
</head>
<body>
  <!-- This is a hidden form for Netlify Forms detection -->
  <form name="contact" netlify netlify-honeypot="bot-field" hidden>
    <input type="text" name="name" />
    <input type="email" name="email" />
    <input type="tel" name="phone" />
    <select name="service">
      <option>Website Development</option>
      <option>Systems Development</option>
      <option>AI Systems & Automation</option>
      <option>Tracking Systems</option>
      <option>Mobile Applications</option>
      <option>Desktop Applications</option>
      <option>E-Commerce Solutions</option>
      <option>Database Solutions</option>
      <option>Digital Marketing & Branding</option>
      <option>Custom Solution</option>
    </select>
    <textarea name="message"></textarea>
    <input type="text" name="bot-field" />
  </form>
</body>
</html>
